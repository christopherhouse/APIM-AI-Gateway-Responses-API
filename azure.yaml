# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/azure-dev-cli_1.36.0/schemas/v1.0/azure.yaml.json
name: apim-responses-affinity
resourceGroup: ${AZURE_RESOURCE_GROUP}
requiredVersions:
  azd: ">= 1.36.0"
infra:
  provider: bicep
  path: infra
  module: deploy
hooks:
  preprovision:
    shell: pwsh
    run: .\scripts\Azd-Hook.ps1 -Stage PreProvision
    interactive: true
  postprovision:
    shell: pwsh
    run: .\scripts\Azd-Hook.ps1 -Stage PostProvision
    interactive: true
  predown:
    shell: pwsh
    run: .\scripts\Azd-Hook.ps1 -Stage PreDown
    interactive: true
  postdown:
    shell: pwsh
    run: .\scripts\Azd-Hook.ps1 -Stage PostDown
    interactive: true
